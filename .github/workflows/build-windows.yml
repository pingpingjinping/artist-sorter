name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ArtistSorter main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ArtistSorter-windows
          path: dist/ArtistSorter.exe
          if-no-files-found: error
